name: CI/CD Pipeline

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]

env:
  NODE_VERSION: '20'

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx eslint src/ --max-warnings=0
      - run: npx prettier --check src/

  test:
    name: Tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm test -- --coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: SAST Scan
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
      - uses: github/codeql-action/analyze@v3
      - name: Secret scan
        uses: trufflesecurity/trufflehog@v3
        with:
          path: ./

  build:
    name: Build & Package
    needs: [lint, test, security]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --production
      - run: |
          mkdir -p deploy
          cp -r node_modules src package.json server.js deploy/
          cp -r .ebextensions deploy/ 2>/dev/null || true
          cd deploy && zip -r ../deployment.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: deployment-package
          path: deployment.zip

  deploy:
    name: Deploy to Production
    needs: build
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    environment: production
    concurrency: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deployment-package
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsDeployRole
          aws-region: us-east-1
      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v21
        with:
          application_name: careerpilot
          environment_name: Careerpilot-env
          version_label: ${{ github.sha }}-${{ github.run_id }}
          region: us-east-1
          deployment_package: deployment.zip
          use_existing_version_if_available: false
          wait_for_deployment: true
          wait_for_environment_recovery: 180
