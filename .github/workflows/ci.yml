name: CI/CD

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

env:
  NODE_VERSION: '20'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-min-16-characters-long
          SESSION_SECRET: test-session-secret-min-16-chars-long
          JWT_EXPIRATION: 15m
          CORS_ORIGINS: http://localhost:3000

  lint:
    name: Lint Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npx eslint src/ --max-warnings=0
        continue-on-error: true

  deploy:
    name: Deploy to AWS Elastic Beanstalk
    needs: [test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --production

      - name: Generate deployment package
        run: |
          mkdir -p deploy
          cp -r node_modules src public server.js package.json deploy/
          cp -r .ebextensions deploy/ 2>/dev/null || true
          cd deploy && zip -r ../deployment.zip .

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v21
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: careerpilot
          environment_name: CareerPilot-prod
          version_label: ${{ github.sha }}-${{ github.run_id }}
          region: us-east-1
          deployment_package: deployment.zip
          use_existing_version_if_available: true
          wait_for_deployment: true
