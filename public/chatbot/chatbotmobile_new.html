<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Resume Builder Chat</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#135bec",
            "background-light": "#f6f6f8",
            "background-dark": "#101622",
          },
          fontFamily: {
            "display": ["Inter"]
          },
          borderRadius: {
            "DEFAULT": "0.5rem",
            "lg": "1rem",
            "xl": "1.5rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<style>
    body {
      font-family: 'Inter', sans-serif;
    }
    .glassmorphism {
      background: rgba(255, 255, 255, 0.2);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .dark .glassmorphism {
      background: rgba(16, 22, 34, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
    .toast-overlay {
      position: fixed; inset: 0; z-index: 999;
      background: rgba(8,8,14,0.7); backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
    }
    .toast-overlay.visible { opacity: 1; pointer-events: auto; }
    .toast-box {
      background: #0F0F1A; border: 1px solid rgba(201,151,58,0.12);
      border-radius: 18px; padding: 1.5rem 1.75rem;
      max-width: 340px; width: 90%; text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      transform: translateY(12px) scale(0.96);
      transition: transform 0.25s ease;
    }
    .toast-overlay.visible .toast-box { transform: translateY(0) scale(1); }
    .toast-icon {
      width: 40px; height: 40px; margin: 0 auto 0.75rem;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .toast-icon.warn { background: rgba(231,76,60,0.12); color: #e74c3c; }
    .toast-icon.success { background: rgba(93,202,165,0.12); color: #5DCAA5; }
    .toast-msg {
      font-family: 'Inter', sans-serif; font-weight: 400;
      font-size: 0.88rem; color: #F0EDE6; line-height: 1.5;
      margin-bottom: 1.25rem;
    }
    .toast-actions { display: flex; gap: 0.6rem; justify-content: center; }
    .toast-btn {
      flex: 1; padding: 0.55rem 1rem; border-radius: 6px;
      font-family: 'Inter', sans-serif; font-weight: 500; font-size: 0.82rem;
      cursor: pointer; border: none; transition: all 0.2s ease;
    }
    .toast-btn.cancel { background: #161628; color: #8A8580; border: 1px solid rgba(201,151,58,0.12); }
    .toast-btn.cancel:hover { color: #F0EDE6; }
    .toast-btn.confirm { background: #e74c3c; color: #fff; }
    .toast-btn.confirm:hover { background: #c0392b; }
  </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative flex flex-col h-screen w-full">
<header class="fixed top-0 left-0 right-0 z-10 glassmorphism">
<div class="flex items-center p-4 gap-2">
<button onclick="goBack()" class="text-slate-800 dark:text-white">
<span class="material-symbols-outlined">arrow_back_ios_new</span>
</button>
<h1 class="flex-1 text-center text-lg font-bold text-slate-900 dark:text-white">Resume Builder Chat</h1>
<button onclick="newConversation()" class="text-slate-800 dark:text-white" title="New conversation">
<span class="material-symbols-outlined">add_circle</span>
</button>
<button onclick="toggleConversations()" class="text-slate-800 dark:text-white" title="Conversations">
<span class="material-symbols-outlined">history</span>
</button>
</div>
</header>

<!-- Toast Notification -->
<div class="toast-overlay" id="toastOverlay">
  <div class="toast-box">
    <div class="toast-icon warn" id="toastIcon">&#9888;</div>
    <p class="toast-msg" id="toastMsg">Are you sure?</p>
    <div class="toast-actions">
      <button class="toast-btn cancel" id="toastCancel" onclick="toastResolve(false)">Cancel</button>
      <button class="toast-btn confirm" id="toastConfirm" onclick="toastResolve(true)">Delete</button>
    </div>
  </div>
</div>

<!-- Conversations Panel -->
<div id="convOverlay" onclick="toggleConversations()" class="fixed inset-0 z-20 bg-black/50 backdrop-blur-sm hidden"></div>
<aside id="convPanel" class="fixed top-0 right-0 bottom-0 z-30 w-80 max-w-[85vw] bg-white dark:bg-background-dark shadow-2xl border-l border-slate-200 dark:border-slate-700 translate-x-full transition-transform duration-300 flex flex-col">
  <div class="flex items-center justify-between p-4 border-b border-slate-200 dark:border-slate-700">
    <h3 class="font-bold text-slate-900 dark:text-white">Conversations</h3>
    <button onclick="toggleConversations()" class="text-slate-500 dark:text-slate-400">
      <span class="material-symbols-outlined">close</span>
    </button>
  </div>
  <div id="convList" class="flex-1 overflow-y-auto">
    <div class="p-4 text-center text-slate-500 text-sm">Loading conversations...</div>
  </div>
</aside>
<main class="flex-1 flex flex-col pt-20 pb-24 px-4 overflow-y-auto">
        <!-- Progress Bar -->
        <div class="mb-4 bg-white/50 dark:bg-black/20 rounded-full h-2">
          <div id="progressBar" class="bg-primary h-2 rounded-full transition-all duration-500" style="width: 0%"></div>
        </div>
        
        <!-- Chat Messages Container -->
        <div id="chatMessages" class="flex flex-col gap-6 flex-1 overflow-y-auto">
          <!-- Messages will be added here dynamically -->
        </div>
        
        <!-- Typing Indicator -->
        <div id="typingIndicator" class="hidden flex items-end gap-3 self-start max-w-xs mt-4">
          <div class="w-10 h-10 rounded-full bg-primary flex items-center justify-center shrink-0">
            <span class="material-symbols-outlined text-white text-lg">smart_toy</span>
          </div>
          <div class="relative flex flex-col gap-1">
            <div class="bg-primary/10 dark:bg-primary/20 text-slate-800 dark:text-slate-200 rounded-lg rounded-bl-none p-3 shadow-md">
              <div class="flex space-x-1">
                <div class="w-2 h-2 bg-slate-400 rounded-full animate-bounce"></div>
                <div class="w-2 h-2 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 0.1s"></div>
                <div class="w-2 h-2 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
              </div>
            </div>
          </div>
        </div>
        
        <!-- Generate Resume Button -->
        <div id="generateResumeBtn" class="hidden mt-6">
          <button onclick="generateResume()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded-xl text-lg transition-colors duration-300 shadow-lg">
            🎉 Generate My Resume
          </button>
        </div>
      </main>
<footer class="fixed bottom-0 left-0 right-0 p-4 glassmorphism">
<div class="flex items-center gap-3">
<input
            id="messageInput"
            class="flex-1 bg-white/50 dark:bg-black/20 border-0 rounded-full h-12 px-5 text-sm text-slate-900 dark:text-white placeholder-slate-500 dark:placeholder-slate-400 focus:ring-2 focus:ring-primary/50 transition-all duration-300"
            placeholder="Type your message..."
            type="text"
            onkeypress="handleKeyPress(event)"
          />
<button
            id="sendButton"
            onclick="sendMessage()"
            class="w-12 h-12 flex items-center justify-center bg-primary rounded-full text-white shrink-0 shadow-lg hover:bg-primary/90 transition-colors duration-300"
          >
<span class="material-symbols-outlined">send</span>
</button>
</div>
<div class="h-safe-area-bottom"></div>
</footer>
</div>

    <script>
      // Global variables
      let currentSessionId = null;
      let currentState = 'welcome';
      let isProcessing = false;
  const API_BASE_URL = '/api';

      /* ─── TOAST SYSTEM ─────────────────────── */
      function showToast({ message, confirmText = 'Delete', cancelText = 'Cancel', type = 'warn' }) {
        return new Promise(resolve => {
          window._toastResolver = resolve;
          const overlay = document.getElementById('toastOverlay');
          const icon = document.getElementById('toastIcon');
          const msg = document.getElementById('toastMsg');
          const btnConfirm = document.getElementById('toastConfirm');
          const btnCancel = document.getElementById('toastCancel');
          msg.textContent = message;
          btnConfirm.textContent = confirmText;
          btnCancel.textContent = cancelText;
          icon.className = 'toast-icon ' + type;
          if (type === 'warn') icon.innerHTML = '&#9888;';
          else if (type === 'success') icon.innerHTML = '&#10003;';
          overlay.classList.add('visible');
        });
      }
      function toastResolve(val) {
        document.getElementById('toastOverlay').classList.remove('visible');
        if (window._toastResolver) { window._toastResolver(val); window._toastResolver = null; }
      }

      // Initialize chatbot
      document.addEventListener('DOMContentLoaded', function() {
        currentSessionId = 'local_' + Date.now();
        addBotMessage("You dey find job you no get resume/cv, no lele nothing spoil. Career Pilot is here to help you! 🚀\n\nI go ask you some questions to build your professional resume. Ready to start?");
      });

      // Start new conversation
      async function startConversation() {
        try {
          console.log('🚀 Starting new conversation...');
          
          const response = await fetch(`${API_BASE_URL}/chatbot/start`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            }
          });
          
          if (!response.ok) {
            throw new Error(`Server responded with ${response.status}`);
          }
          
          const data = await response.json();
          console.log('✅ Conversation started:', data);
          
          currentSessionId = data.sessionId;
          currentState = data.state;
          
          // Add welcome message
          addBotMessage(data.response);
          updateProgress(data.progress || 0);
          
        } catch (error) {
          console.error('❌ Error starting conversation:', error);
          addBotMessage("Sorry, I'm having trouble connecting. Please refresh the page and try again.");
        }
      }

      // Send user message
      async function sendMessage() {
        const input = document.getElementById('messageInput');
        const message = input.value.trim();
        
        if (!message || isProcessing) return;
        
        // Add user message to chat
        addUserMessage(message);
        input.value = '';
        
        // Show typing indicator
        showTypingIndicator();
        isProcessing = true;
        
        try {
          console.log('💬 Sending message:', message);

          if (currentSessionId && currentSessionId.startsWith('local_')) {
            const startRes = await fetch(`${API_BASE_URL}/chatbot/start`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' }
            });
            const startData = await startRes.json();
            currentSessionId = startData.sessionId;
          }

          const response = await fetch(`${API_BASE_URL}/chatbot/message`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              message: message,
              sessionId: currentSessionId
            })
          });
          
          if (!response.ok) {
            throw new Error(`Server responded with ${response.status}`);
          }
          
          const data = await response.json();
          console.log('✅ Received response:', data);
          
          // Hide typing indicator and add bot response
          hideTypingIndicator();
          addBotMessage(data.response);
          
          // Update state and progress
          currentState = data.state;
          updateProgress(data.progress || 0);
          
          // Show generate button if completed
          if (data.state === 'completed') {
            showGenerateButton();
          }
          
        } catch (error) {
          console.error('❌ Error sending message:', error);
          hideTypingIndicator();
          addBotMessage("Sorry, I encountered an error. Please try again.");
        } finally {
          isProcessing = false;
        }
      }

      // Generate resume
      async function generateResume() {
        try {
          console.log('📄 Generating resume...');
          
          const response = await fetch(`${API_BASE_URL}/chatbot/generate`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              sessionId: currentSessionId
            })
          });
          
          if (!response.ok) {
            throw new Error(`Server responded with ${response.status}`);
          }
          
          const data = await response.json();
          console.log('✅ Resume generated:', data);
          
          addBotMessage(data.message);
          
          // Add download options
          setTimeout(() => {
            addDownloadOptions();
          }, 1000);
          
        } catch (error) {
          console.error('❌ Error generating resume:', error);
          addBotMessage("Sorry, I couldn't generate your resume. Please try again.");
        }
      }

      // Handle Enter key press
      function handleKeyPress(event) {
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          sendMessage();
        }
      }

      // UI Helper Functions
      function addUserMessage(message) {
        const chatMessages = document.getElementById('chatMessages');
        const messageDiv = document.createElement('div');
        messageDiv.className = 'flex items-end gap-3 self-end max-w-xs';
        messageDiv.innerHTML = `
          <div class="relative flex flex-col gap-1">
            <div class="bg-primary text-white rounded-lg rounded-br-none p-3 shadow-md">
              <p class="text-sm">${escapeHtml(message)}</p>
            </div>
          </div>
        `;
        chatMessages.appendChild(messageDiv);
        scrollToBottom();
      }

      function addBotMessage(message) {
        const chatMessages = document.getElementById('chatMessages');
        const messageDiv = document.createElement('div');
        messageDiv.className = 'flex items-end gap-3 self-start max-w-xs';
        
        // Format message with line breaks and bold text
        const formattedMessage = formatBotMessage(message);
        
        messageDiv.innerHTML = `
          <div class="w-10 h-10 rounded-full bg-primary flex items-center justify-center shrink-0">
            <span class="material-symbols-outlined text-white text-lg">smart_toy</span>
          </div>
          <div class="relative flex flex-col gap-1">
            <div class="bg-primary/10 dark:bg-primary/20 text-slate-800 dark:text-slate-200 rounded-lg rounded-bl-none p-3 shadow-md">
              <div class="text-sm">${formattedMessage}</div>
            </div>
          </div>
        `;
        chatMessages.appendChild(messageDiv);
        scrollToBottom();
      }

      function formatBotMessage(message) {
        return message
          .replace(/\n/g, '<br>')
          .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
          .replace(/🚀|💬|📝|👋|💼|🎓|💪|🔥|🛠️|🎯|🔗|📋|👤|🎉|📄/g, '<span class="text-lg">$&</span>');
      }

      function showTypingIndicator() {
        document.getElementById('typingIndicator').classList.remove('hidden');
        scrollToBottom();
      }

      function hideTypingIndicator() {
        document.getElementById('typingIndicator').classList.add('hidden');
      }

      function updateProgress(percentage) {
        const progressBar = document.getElementById('progressBar');
        progressBar.style.width = `${percentage}%`;
      }

      function showGenerateButton() {
        document.getElementById('generateResumeBtn').classList.remove('hidden');
        scrollToBottom();
      }

      function addDownloadOptions() {
        const chatMessages = document.getElementById('chatMessages');
        const downloadDiv = document.createElement('div');
        downloadDiv.className = 'flex items-end gap-3 self-start max-w-xs';
        downloadDiv.innerHTML = `
          <div class="w-10 h-10 rounded-full bg-primary flex items-center justify-center shrink-0">
            <span class="material-symbols-outlined text-white text-lg">smart_toy</span>
          </div>
          <div class="relative flex flex-col gap-2">
            <div class="bg-white dark:bg-background-dark border border-slate-200 dark:border-slate-700 rounded-lg p-4 shadow-md">
              <p class="text-sm font-medium text-slate-800 dark:text-slate-200 mb-3">
                🎉 Your resume is ready! You can now:
              </p>
              <div class="flex flex-col space-y-2">
                <button onclick="viewResume()" class="flex items-center justify-center gap-3 w-full bg-primary text-white rounded-full py-2.5 text-sm font-medium hover:bg-primary/90 transition-colors duration-300">
                  <span class="material-symbols-outlined">visibility</span>
                  View My Resume
                </button>
                <button onclick="downloadResume()" class="flex items-center justify-center gap-3 w-full bg-green-600 text-white rounded-full py-2.5 text-sm font-medium hover:bg-green-700 transition-colors duration-300">
                  <span class="material-symbols-outlined">download</span>
                  Download Resume
                </button>
              </div>
            </div>
          </div>
        `;
        chatMessages.appendChild(downloadDiv);
        scrollToBottom();
      }

      function viewResume() {
        // Redirect to resume page
        window.location.href = '/resume/mobile';
      }

      async function downloadResume() {
        try {
          addBotMessage("Generating your PDF resume...");
          const res = await fetch(`${API_BASE_URL}/chatbot/download`);
          if (!res.ok) throw new Error(`Server responded with ${res.status}`);
          const disp = res.headers.get('Content-Disposition') || '';
          const name = (disp.match(/filename="?([^"]+)"?/) || [])[1] || 'resume.pdf';
          const blob = await res.blob();
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = name;
          a.click();
          URL.revokeObjectURL(url);
          addBotMessage("Your resume has been downloaded! You can also view it on the Resume page anytime! 🎉");
        } catch (err) {
          console.error('Download error:', err);
          addBotMessage("Sorry, I couldn't download your resume. Please try again.");
        }
      }

      function scrollToBottom() {
        setTimeout(() => {
          const chatMessages = document.getElementById('chatMessages');
          chatMessages.scrollTop = chatMessages.scrollHeight;
        }, 100);
      }

      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      // Go back function
      function goBack() {
        window.history.back();
      }

      // Session Management
      async function toggleConversations() {
        const panel = document.getElementById('convPanel');
        const overlay = document.getElementById('convOverlay');
        const isOpen = panel.classList.toggle('translate-x-0');
        panel.classList.toggle('translate-x-full', !isOpen);
        overlay.classList.toggle('hidden', !isOpen);
        if (isOpen) await loadConversations();
      }

      async function loadConversations() {
        const list = document.getElementById('convList');
        list.innerHTML = '<div class="p-4 text-center text-slate-500 text-sm">Loading conversations...</div>';
        try {
          const res = await fetch(`${API_BASE_URL}/chatbot/conversations`);
          const data = await res.json();
          if (!data.success || !data.conversations.length) {
            list.innerHTML = '<div class="p-4 text-center text-slate-500 text-sm">No conversations yet.</div>';
            return;
          }
          list.innerHTML = data.conversations.map(c => {
            const date = new Date(c.lastActivity).toLocaleDateString('en-GB', {
              day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'
            });
            const isActive = c.sessionId === currentSessionId;
            const badge = c.status === 'completed' ? '✅' : '🔄';
            const preview = c.preview ? escapeHtml(c.preview.substring(0, 60)) : c.state;
            return `<button onclick="switchConversation('${c.sessionId}')" class="relative w-full text-left p-3 pr-10 border-b border-slate-100 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-white/5 transition-colors ${isActive ? 'bg-primary/5 border-l-2 border-l-primary' : ''}">
              <div class="text-sm font-medium text-slate-900 dark:text-white">${badge} Resume Chat</div>
              <div class="text-xs text-slate-500 mt-0.5 truncate">${preview}</div>
              <div class="text-xs text-slate-400 mt-0.5">${date}</div>
              <span onclick="deleteConversation('${c.sessionId}', event)" class="absolute top-3 right-3 text-slate-400 hover:text-red-500 p-1 rounded" title="Delete"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg></span>
            </button>`;
          }).join('');
        } catch (err) {
          list.innerHTML = '<div class="p-4 text-center text-slate-500 text-sm">Failed to load.</div>';
        }
      }

      async function switchConversation(sessionId) {
        if (sessionId === currentSessionId) return;
        toggleConversations();
        try {
          const res = await fetch(`${API_BASE_URL}/chatbot/conversations/${sessionId}`);
          const data = await res.json();
          if (!data.success || !data.conversation) return;
          const conv = data.conversation;
          document.getElementById('chatMessages').innerHTML = '';
          document.getElementById('generateResumeBtn').classList.add('hidden');
          if (conv.messages && conv.messages.length) {
            for (const msg of conv.messages) {
              if (msg.role === 'user') addUserMessage(msg.content);
              else addBotMessage(msg.content);
            }
          }
          currentSessionId = conv.sessionId;
          if (conv.state) {
            currentState = conv.state;
            const stateProgress = {
              welcome: 0, personal_info: 15, professional_summary: 25,
              professional_links: 35, education: 50, work_experience: 65,
              skills: 75, projects: 80, certificates: 85,
              achievements: 90, review: 95, completed: 100,
            };
            updateProgress(stateProgress[conv.state] ?? 0);
          }
          if (conv.state === 'completed') showGenerateButton();
        } catch (err) {
          console.error('Switch error:', err);
        }
      }

      async function newConversation() {
        const panel = document.getElementById('convPanel');
        const overlay = document.getElementById('convOverlay');
        panel.classList.remove('translate-x-0');
        panel.classList.add('translate-x-full');
        overlay.classList.add('hidden');
        document.getElementById('chatMessages').innerHTML = '';
        document.getElementById('generateResumeBtn').classList.add('hidden');
        currentSessionId = 'local_' + Date.now();
        addBotMessage("You dey find job you no get resume/cv, no lele nothing spoil. Career Pilot is here to help you! 🚀\n\nI go ask you some questions to build your professional resume. Ready to start?");
      }

      async function deleteConversation(sessionId, event) {
        event.stopPropagation();
        const ok = await showToast({ message: 'Delete this conversation? This cannot be undone.', confirmText: 'Delete', type: 'warn' });
        if (!ok) return;
        try {
          const res = await fetch(`${API_BASE_URL}/chatbot/conversations/${sessionId}`, {
            method: 'DELETE',
          });
          const data = await res.json();
          if (data.success) {
            if (sessionId === currentSessionId) {
              document.getElementById('chatMessages').innerHTML = '';
              document.getElementById('generateResumeBtn').classList.add('hidden');
              startConversation();
            }
            loadConversations();
          } else {
            await showToast({ message: data.message || 'Failed to delete conversation.', confirmText: 'OK', type: 'warn' });
          }
        } catch (err) {
          console.error('Delete conversation error:', err);
          await showToast({ message: 'Network error. Please try again.', confirmText: 'OK', type: 'warn' });
        }
      }
    </script>
</body>
</html>
