<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | CareerPilot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:   #08080E;
      --surf: #0F0F1A;
      --gold: #C9973A;
      --gold-b: #E8B45A;
      --tp:   #F0EDE6;
      --ts:   #8A8580;
      --tt:   #484644;
      --bs:   rgba(201,151,58,0.12);
    }

    body {
      background-color: var(--bg);
      background-image:
        linear-gradient(var(--bs) 1px, transparent 1px),
        linear-gradient(90deg, var(--bs) 1px, transparent 1px);
      background-size: 60px 60px;
      color: var(--tp);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
      padding: 2rem;
      max-width: 520px;
    }

    .code {
      font-family: 'Cormorant Garamond', serif;
      font-size: 7rem;
      font-weight: 600;
      color: var(--gold);
      line-height: 1;
      margin-bottom: 0.5rem;
      text-shadow: 0 0 40px rgba(201,151,58,0.25);
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.6rem;
      font-weight: 400;
      color: var(--tp);
      margin-bottom: 1rem;
    }

    p {
      color: var(--ts);
      font-size: 0.95rem;
      line-height: 1.7;
      margin-bottom: 2rem;
    }

    .btn {
      display: inline-block;
      padding: 0.75rem 2rem;
      border: 1px solid var(--gold);
      border-radius: 6px;
      color: var(--gold);
      text-decoration: none;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      font-size: 0.9rem;
      transition: all 0.3s ease;
    }

    .btn:hover {
      background: var(--gold);
      color: var(--bg);
      box-shadow: 0 0 30px rgba(201,151,58,0.38);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>
    <a href="/" class="btn">Back to Home</a>
  </div>
</body>
</html>
