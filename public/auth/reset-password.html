<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password · CareerPilot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #0f172a 0%, #1e293b 100%);
      color: #e2e8f0;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 40px 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    h1 { font-size: 24px; font-weight: 600; margin-bottom: 8px; }
    p.sub { color: #94a3b8; font-size: 14px; margin-bottom: 28px; }
    label { display: block; font-size: 13px; color: #cbd5e1; margin: 16px 0 6px; }
    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #f1f5f9;
      font-size: 15px;
    }
    input:focus { outline: none; border-color: #38bdf8; }
    button {
      width: 100%;
      margin-top: 24px;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: #0ea5e9;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .msg { margin-top: 16px; font-size: 14px; border-radius: 8px; padding: 10px 12px; }
    .msg.error { background: rgba(239,68,68,0.12); color: #fca5a5; }
    .msg.success { background: rgba(34,197,94,0.12); color: #86efac; }
    .hidden { display: none; }
    .hint { font-size: 12px; color: #64748b; margin-top: 6px; }
    a { color: #38bdf8; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Reset your password</h1>
    <p class="sub">Choose a new password for your CareerPilot account.</p>

    <form id="resetForm" class="hidden">
      <label for="password">New password</label>
      <input type="password" id="password" minlength="8" autocomplete="new-password" required />
      <p class="hint">At least 8 characters, with an uppercase letter, a lowercase letter, and a number.</p>

      <label for="confirm">Confirm new password</label>
      <input type="password" id="confirm" minlength="8" autocomplete="new-password" required />

      <button type="submit" id="submitBtn">Reset password</button>
    </form>

    <div class="msg error hidden" id="errorMsg"></div>
    <div class="msg success hidden" id="successMsg"></div>
    <div class="msg hidden" id="invalidMsg">
      This reset link is invalid or has expired.
      <a href="/public/auth/login.html">Return to login</a>.
    </div>
  </div>

  <script>
    const API_BASE = '/api';
    const token = new URLSearchParams(window.location.search).get('token');

    const form = document.getElementById('resetForm');
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');
    const invalidMsg = document.getElementById('invalidMsg');

    function show(el, msg) {
      [errorMsg, successMsg, invalidMsg].forEach((m) => m.classList.add('hidden'));
      if (el) {
        if (msg) el.textContent = msg;
        el.classList.remove('hidden');
      }
    }

    if (!token) {
      show(invalidMsg);
      form.classList.add('hidden');
    } else {
      form.classList.remove('hidden');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      const btn = document.getElementById('submitBtn');

      if (password !== confirm) {
        show(errorMsg, 'Passwords do not match.');
        return;
      }

      btn.disabled = true;
      try {
        const res = await fetch(`${API_BASE}/auth/reset-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword: password }),
        });
        const data = await res.json();
        if (res.ok) {
          show(successMsg, 'Password reset successfully. Redirecting to login…');
          setTimeout(() => { window.location.href = '/public/auth/login.html?reset=1'; }, 1500);
        } else {
          show(errorMsg, data.message || 'Unable to reset password.');
        }
      } catch (err) {
        show(errorMsg, 'Network error. Please try again.');
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
