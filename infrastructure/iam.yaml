AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Grants the Elastic Beanstalk deploy IAM user permission to use EC2 launch
  templates (fixes "You are not authorized to use launch template" during
  Auto Scaling group updates).

Parameters:
  DeployUserName:
    Type: String
    Description: Name of the IAM user used by GitHub Actions (the one behind AWS_ACCESS_KEY_ID secret).
    Default: github-actions-deploy

Resources:
  CareerPilotLaunchTemplatePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: CareerPilot-BeanstalkLaunchTemplateAccess
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowRunInstancesWithLaunchTemplates
            Effect: Allow
            Action:
              - ec2:RunInstances
              - ec2:CreateLaunchTemplate
              - ec2:CreateLaunchTemplateVersion
              - ec2:ModifyLaunchTemplate
              - ec2:DeleteLaunchTemplate
              - ec2:DescribeLaunchTemplates
              - ec2:DescribeLaunchTemplateVersions
            Resource: '*'
      Users:
        - !Ref DeployUserName

Outputs:
  PolicyArn:
    Description: ARN of the managed policy attached to the deploy user.
    Value: !Ref CareerPilotLaunchTemplatePolicy